# /projects/robot.conf: sourced by `act` (bash). Arm ports and cameras for recording.

# Arms: fill in from `act devices` once they're plugged in.
# LEADER_PORT=/dev/serial/by-id/...
# FOLLOWER_PORT=/dev/serial/by-id/...

# Cameras passed to lerobot-record. Name them yourself (the names end up in the dataset and policy).
# Use the by-id paths so it doesn't matter which /dev/videoN a camera lands on, and force MJPG:
# OpenCV may otherwise pick YUYV, which is 5 fps at 1080p on cam 1.
# CAMERAS='{ NAME1: {type: opencv, index_or_path: /dev/v4l/by-id/usb-Innomaker_Innomaker-U20CAM-1080p-S1_SN0001-video-index0, width: 640, height: 480, fps: 30, fourcc: MJPG}, NAME2: {type: opencv, index_or_path: /dev/v4l/by-id/usb-icSpring_icspring_camera_20240307110322-video-index0, width: 640, height: 480, fps: 30, fourcc: MJPG} }'

# v4l2 controls that `act record` (and `act cameras`) apply and verify before every recording.
# One entry per camera: "DEVICE ctrl=value ...". exposure_time_absolute is in 100 us units;
# keep it <= 330 (33 ms) or the frame rate drops. Raise gain (cam 1: 0-100, cam 2: 0-63) if too dark.
CAMERA_CONTROLS=(
  # cam 1 (Innomaker): fixed exposure and white balance. It also keeps these through a power cycle.
  "/dev/v4l/by-id/usb-Innomaker_Innomaker-U20CAM-1080p-S1_SN0001-video-index0 auto_exposure=1 exposure_time_absolute=300 gain=0 white_balance_automatic=0 white_balance_temperature=3500"
  # cam 2 (icSpring): must be manual; its auto exposure drops to 16-20 fps indoors (no AE-priority control).
  # Its white balance stays auto. To fix it too, add: white_balance_automatic=0 white_balance_temperature=3500
  "/dev/v4l/by-id/usb-icSpring_icspring_camera_20240307110322-video-index0 auto_exposure=1 exposure_time_absolute=300 gain=0"
)
