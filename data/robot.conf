# /projects/robot.conf: sourced by `act` (bash). Arm ports and cameras for recording.

# Arms (CH343 adapters). Identified 2026-11-23 by reading each servo's homing offset, which
# matches data/calibration/<arm>.json.
LEADER_PORT=/dev/serial/by-id/usb-1a86_USB_Single_Serial_5B90102635-if00
FOLLOWER_PORT=/dev/serial/by-id/usb-1a86_USB_Single_Serial_5B90102783-if00

# The cameras by role, for `just rig` (teleop records the wrist camera into the session's MCAP,
# the scene camera beside it as video).
WRIST_CAMERA=/dev/v4l/by-id/usb-icSpring_icspring_camera_20240307110322-video-index0
SCENE_CAMERA=/dev/v4l/by-id/usb-Innomaker_Innomaker-U20CAM-1080p-S1_SN0001-video-index0

# Cameras passed to lerobot-record. Name them yourself (the names end up in the dataset and policy).
# Use the by-id paths so it doesn't matter which /dev/videoN a camera lands on, and force MJPG:
# OpenCV may otherwise pick YUYV, which is 5 fps at 1080p on the scene camera.
# CAMERAS='{ scene: {type: opencv, index_or_path: /dev/v4l/by-id/usb-Innomaker_Innomaker-U20CAM-1080p-S1_SN0001-video-index0, width: 640, height: 480, fps: 30, fourcc: MJPG}, wrist: {type: opencv, index_or_path: /dev/v4l/by-id/usb-icSpring_icspring_camera_20240307110322-video-index0, width: 640, height: 480, fps: 30, fourcc: MJPG} }'

# v4l2 controls that `act record` (and `act cameras`) apply and verify before every recording.
# One entry per camera: "DEVICE ctrl=value ...". exposure_time_absolute is in 100 us units;
# keep it <= 330 (33 ms) or the frame rate drops. Raise gain (scene: 0-100, wrist: 0-63) if too dark.
CAMERA_CONTROLS=(
  # scene camera (Innomaker): fixed exposure and white balance. It also keeps these through a power cycle.
  "/dev/v4l/by-id/usb-Innomaker_Innomaker-U20CAM-1080p-S1_SN0001-video-index0 auto_exposure=1 exposure_time_absolute=300 gain=0 white_balance_automatic=0 white_balance_temperature=3500"
  # wrist camera (icSpring): must be manual; it forgets this when unplugged, so `act` re-applies it every start; its auto exposure drops to 16-20 fps indoors (no AE-priority control).
  # Fixed white balance at the scene camera's 3500 K: auto turned the warm room orange-red (2026-11-24); gain 16 brightens it to match.
  "/dev/v4l/by-id/usb-icSpring_icspring_camera_20240307110322-video-index0 auto_exposure=1 exposure_time_absolute=300 gain=16 white_balance_automatic=0 white_balance_temperature=3500"
)
