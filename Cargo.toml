[workspace]
resolver = "2"
members = ["crates/so101"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/koudesh3/so101"

[workspace.dependencies]
serialport = { version = "4", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
protox = "0.10"
bytes = "1"
libc = "0.2"
sha2 = "0.10"
mcap = { version = "0.26", default-features = false }
v4l = "0.14"

[profile.release]
debug = 1
