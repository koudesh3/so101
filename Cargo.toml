[workspace]
resolver = "2"
members = [
    "src/robot/drivers",
    "src/robot/control",
    "src/robot/cli",
    "src/web/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/koudesh3/so101"

[workspace.dependencies]
drivers = { path = "src/robot/drivers" }
control = { path = "src/robot/control" }
web-server = { path = "src/web/server" }
serialport = { version = "4", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"

[profile.release]
debug = 1
