[package]
name = "so101"
version = "0.1.0"
edition = "2021"
description = "Bare-metal-minded driver, calibrator, monitor and 1:1 teleop for the LeRobot SO-101 arm"

[dependencies]
serialport = { version = "4", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"

[profile.release]
debug = 1
