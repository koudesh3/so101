[workspace]
resolver = "2"
members = [
    "crates/contracts",
    "crates/session-log",
    "crates/drivers",
    "crates/control",
    "crates/cli",
    "crates/web-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/koudesh3/so101"

[workspace.dependencies]
contracts = { path = "crates/contracts" }
session-log = { path = "crates/session-log" }
drivers = { path = "crates/drivers" }
control = { path = "crates/control" }
web-server = { path = "crates/web-server" }
serialport = { version = "4", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
protox = "0.10"
bytes = "1"
libc = "0.2"
mcap = { version = "0.26", default-features = false }

[profile.release]
debug = 1
