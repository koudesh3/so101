// The messages the robot writes into its session logs. See docs/phase0.md.
//
// - Times are nanoseconds of the host's CLOCK_MONOTONIC (contract 3).
// - Poses are degrees, LeRobot's units; the gripper is 0-100.
// - Pose arrays have exactly six entries, in LeRobot's order: shoulder_pan, shoulder_lift,
//   elbow_flex, wrist_flex, wrist_roll, gripper.
// - Camera frames are foxglove.CompressedImage (proto/foxglove), not a message here.
//
// Evolution rules (contract 1): never reuse or renumber a field; removed fields become
// `reserved`; breaking changes go in so101.v2. The schema snapshot test enforces this. The
// snapshot was reset once, on 2026-11-23, before the first real log was recorded.

syntax = "proto3";

package so101.v1;

enum Joint {
  JOINT_UNSPECIFIED = 0;
  SHOULDER_PAN = 1;
  SHOULDER_LIFT = 2;
  ELBOW_FLEX = 3;
  WRIST_FLEX = 4;
  WRIST_ROLL = 5;
  GRIPPER = 6;
}

enum Camera {
  CAMERA_UNSPECIFIED = 0;
  WRIST = 1;
  SCENE = 2;
}

enum SourceKind {
  SOURCE_KIND_UNSPECIFIED = 0;
  TELEOP = 1;
  SCRIPT = 2;
  POLICY = 3;
}

// `name` is the script's name or the policy's checkpoint ID.
message Source {
  SourceKind kind = 1;
  string name = 2;
}

// In the servo loop the record's sequence is the slot index (contract 5).
message JointState {
  uint64 t_ns = 1;
  repeated float pose = 2;
  repeated int32 counts = 3;  // raw encoder counts behind `pose`; empty if not read from servos
}

message JointTarget {
  uint64 t_ns = 1;
  repeated float pose = 2;
  Source source = 3;
  repeated int32 counts = 4;  // raw goals written, in encoder counts; empty if not sent to servos
}

enum Fault {
  FAULT_UNSPECIFIED = 0;
  VOLTAGE = 1;
  SENSOR = 2;
  OVERHEAT = 3;
  OVERCURRENT = 4;
  ANGLE_LIMIT = 5;
  OVERLOAD = 6;
}

// One joint's actuator, read one joint per slot in rotation. Optional because 0 is a valid reading.
message ActuatorStatus {
  uint64 t_ns = 1;
  Joint joint = 2;
  optional float velocity_deg_s = 3;
  optional float load_percent = 4;  // of maximum torque, signed
  optional float voltage_v = 5;
  optional float temperature_c = 6;
  optional float current_a = 7;
  repeated Fault faults = 8;
}

message FrameRef {
  Camera camera = 1;
  uint32 sequence = 2;  // the kernel's frame number
}

// What the control loop used at one tick (contract 2).
message Tick {
  uint64 t_ns = 1;
  uint32 slot = 2;  // the servo slot whose JointState this tick used and in which its target was written
  repeated float state = 3;
  FrameRef wrist = 4;
  FrameRef scene = 5;
  repeated float action = 6;     // sent to the follower, after clipping
  Source source = 7;
  repeated float requested = 8;  // what the source asked for, before clipping
  repeated Clip clipped = 9;
}

enum Limit {
  LIMIT_UNSPECIFIED = 0;
  STEP = 1;   // LeRobot's max_relative_target
  RANGE = 2;
  STALL = 3;  // held at a contact point after a stall or an overload trip
}

message Clip {
  Joint joint = 1;
  Limit limit = 2;
}

// k rows of six, row-major.
message Chunk {
  uint64 t_obs_ns = 1;
  uint64 period_ns = 2;
  uint32 k = 3;
  repeated float actions = 4;
  string checkpoint_id = 5;
}

// Messages the recorder had to drop because it fell behind.
message RecorderDrop {
  uint64 t_ns = 1;
  string topic = 2;
  uint32 first_sequence = 3;
  uint32 last_sequence = 4;
  uint32 count = 5;
}
